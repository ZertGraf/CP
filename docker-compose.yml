services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plantation
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./plantation-api/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./plantation-api/migrations/002_simulation.sql:/docker-entrypoint-initdb.d/002_simulation.sql
      - ./plantation-api/migrations/003_gamification.sql:/docker-entrypoint-initdb.d/003_gamification.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./plantation-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/plantation?sslmode=disable
      JWT_SECRET: change-me-in-production
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./plantation-front
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pg_data: